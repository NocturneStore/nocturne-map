<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NOCTURNE | Second Life</title>

    <!-- MAPA OFICIAL SECOND LIFE -->
    <script src="https://maps.secondlife.com/_scripts/sl.mapapi2.js"></script>

    <link rel="stylesheet"
          href="https://maps.secondlife.com/_styles/sl.mapapi2.css">

    <style>

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #080808;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* MAPA */

        #map-container {
            width: 100%;
            height: 100vh;
        }


        /* MENSAJE DE CARGA */

        #status {

            position: absolute;

            z-index: 9999;

            top: 15px;
            left: 50%;

            transform: translateX(-50%);

            background:
                rgba(0, 0, 0, 0.90);

            color: white;

            padding:
                10px 20px;

            border-radius:
                8px;

            font-size:
                14px;
        }


        /* POPUP */

        .nocturne-popup {

            text-align: center;

            min-width: 210px;

            padding: 5px;
        }


        .nocturne-popup h2 {

            margin:
                4px 0 8px 0;

            font-size:
                22px;

            letter-spacing:
                1px;
        }


        .subtitle {

            font-weight:
                bold;

            margin-bottom:
                15px;
        }


        .products {

            line-height:
                1.5;

            margin-bottom:
                15px;
        }


        /* BOTÓN TELEPORT */

        .teleport {

            display:
                inline-block;

            margin-top:
                8px;

            padding:
                12px 24px;

            background:
                #721397;

            color:
                white !important;

            text-decoration:
                none;

            border-radius:
                6px;

            font-weight:
                bold;

            transition:
                0.2s;
        }


        .teleport:hover {

            background:
                #941cc1;

            transform:
                scale(1.04);
        }


    </style>

</head>


<body>


    <!-- CARGANDO -->

    <div id="status">

        Cargando NOCTURNE...

    </div>


    <!-- MAPA -->

    <div id="map-container"></div>



<script>


/* ====================================================
   DATOS DE TU TIENDA
==================================================== */


const REGION = "Lobishomen";


const LOCAL_X = 252;

const LOCAL_Y = 201;

const LOCAL_Z = 3401;



/* ====================================================
   ENLACE OFICIAL SECOND LIFE
==================================================== */


const SLURL =

    "https://maps.secondlife.com/secondlife/" +

    encodeURIComponent(REGION) +

    "/" +

    LOCAL_X +

    "/" +

    LOCAL_Y +

    "/" +

    LOCAL_Z;



/* ====================================================
   OBTENER POSICIÓN GLOBAL DE LA REGIÓN
==================================================== */


function cargarRegion() {


    const script =
        document.createElement("script");


    script.src =

        "https://cap.secondlife.com/cap/0/" +

        "d661249b-2b5a-4436-966a-3d3b8d7a574f" +

        "?var=regionCoords&sim_name=" +

        encodeURIComponent(REGION);



    script.onload =
        crearMapa;



    script.onerror =
        function() {


            document.getElementById(
                "status"
            ).innerHTML =

                "No se pudo cargar la región de Second Life.";


        };


    document.head.appendChild(
        script
    );

}



/* ====================================================
   CREAR MAPA
==================================================== */


function crearMapa() {


    if (
        typeof regionCoords ===
        "undefined"
    ) {


        document.getElementById(
            "status"
        ).innerHTML =

            "No se encontró la región " +
            REGION +
            ".";


        return;

    }



    /* ------------------------------------------
       POSICIÓN EXACTA EN EL MAPA
    ------------------------------------------ */


    const MAP_X =

        regionCoords.x +

        (
            LOCAL_X /
            256
        );


    const MAP_Y =

        regionCoords.y +

        (
            LOCAL_Y /
            256
        );



    /* ------------------------------------------
       CREAR MAPA SECOND LIFE
    ------------------------------------------ */


    const mapa =

        SLMap(

            document.getElementById(
                "map-container"
            )

        );



    mapa.setView(

        [
            MAP_Y,
            MAP_X
        ],

        8

    );



    /* ====================================================
       PIN PERSONALIZADO NOCTURNE
    ==================================================== */


    const nocturneIcon =

        L.icon({

            iconUrl:
                "nocturne-pin.png",


            iconSize:
                [
                    100,
                    120
                ],


            iconAnchor:
                [
                    50,
                    120
                ],


            popupAnchor:
                [
                    0,
                    -115
                ]

        });



    /* ====================================================
       COLOCAR EL PIN
    ==================================================== */


    const marker =

        L.marker(

            [
                MAP_Y,
                MAP_X
            ],

            {

                icon:
                    nocturneIcon

            }

        ).addTo(
            mapa
        );



    /* ====================================================
       VENTANA NOCTURNE
    ==================================================== */


    marker.bindPopup(`


        <div class="nocturne-popup">


            <h2>

                NOCTURNE

            </h2>


            <div class="subtitle">

                Gothic & Kawaii Gothic

            </div>


            <div class="products">

                Shapes • Skins • Tattoos

                <br>

                Eyes • Add-ons • Accessories

            </div>


            <a

                class="teleport"

                href="${SLURL}"

                target="_blank"

                rel="noopener noreferrer"

            >

                TELEPORT

            </a>


        </div>


    `);



    /* ABRIR AUTOMÁTICAMENTE
       LA VENTANA DEL PIN */


    marker.openPopup();



    /* QUITAR MENSAJE CARGANDO */


    document.getElementById(
        "status"
    ).style.display =
        "none";


}



/* ====================================================
   INICIAR TODO
==================================================== */


window.addEventListener(

    "load",

    cargarRegion

);


</script>


</body>

</html>
